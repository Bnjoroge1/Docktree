# Generated by loopt. Edit the source under .loopt/workflows and run loopt gen.
# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 1
    - name: Run agent
      uses: pullfrog/pullfrog@31e8ce51583f5e108ace8fb0bbb302e85cf38e04
      with:
        prompt: ${{ inputs.prompt }}

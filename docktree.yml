compose: {}
identity: {}
worktrees:
    root: ../${repo}.worktrees
setup:
    copy:
        - .env
    symlink:
        - node_modules
volumes: {}
ports:
    mode: dynamic
    bind_host: 127.0.0.1
    range: 41000-49999
transforms:
    container_name: strip
    built_image: rewrite
    docker_socket: warn
    external_network: ""
    named_volume: ""
state:
    directory: .docktree
